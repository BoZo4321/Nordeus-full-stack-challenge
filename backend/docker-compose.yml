services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rpgdb
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: rpg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg -d rpgdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rpgdb
      SPRING_DATASOURCE_USERNAME: rpg
      SPRING_DATASOURCE_PASSWORD: rpg
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
